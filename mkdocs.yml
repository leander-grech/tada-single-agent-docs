site_name: TADA Single-Agent RL
site_description: Single-agent ATC arrival sequencing with sb3-contrib MaskablePPO
docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Reference:
      - MDP & Environment: mdp.md
      - Observations: observations.md
      - Reward: reward.md
      - Loss of separation: separation.md
      - Training: training.md
      - Instrumentation: instrumentation.md
  - Experiments:
      - Experiment log: experiments.md
      - Successful results: successful_results.md
  - Analysis:
      - How an agent is tested: analysis_methods.md
      - Test log: analysis_log.md
      - 22 clearances vs 15: analysis_v1_v2.md
  - Roadmap: roadmap.md
