site_name: TADA · single-agent RL
site_description: "Single-agent RL arrival sequencing into Milan Malpensa: models, findings and how to train one"
docs_dir: docs

theme:
  name: material
  font: false
  icon:
    logo: material/airplane
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/tada-components.css
  - stylesheets/theme.css

extra_javascript:
  - javascripts/tada.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

not_in_nav: |
  /analysis_log.md
  /analysis_methods.md
  /analysis_v1_v2.md
  /experiments.md
  /instrumentation.md
  /mdp.md
  /observations.md
  /pbrs.md
  /reward.md
  /separation.md
  /successful_results.md
  /training.md
  /windowed.md
  /backfill.md

