# Model registry. tools/build_model_docs.py reads this plus the code repo's evaluation files
# (read-only) and writes the leaderboard, the best-model page, one report card per model,
# the render gallery, the Home box and BACKFILL.md.
#
# Paths under `run`, `evals`, `curve`, `attempts` and render `meta` are relative to the code
# repo (override with --code-repo or TADA_CODE_REPO). Render `file` is under docs/assets/renders/.
#
# Per model:
#   id           run id as used on the site
#   track        windowed | ten_aircraft
#   run          experiment directory
#   checkpoint   the checkpoint the card is about, relative to `run`
#   parent       id whose weights this run started from (null = random init)
#   compare      id to compute "vs parent" deltas against (default: parent)
#   status       complete | stopped | in_progress | not_adopted
#   steps        steps trained in this run, when the run did not reach total_timesteps
#   whats_new    one line: what this run changed
#   evals        battery -> CSV (windowed: f20, s2x20, att10, la4, f40; ten_aircraft: d100)
#   headline     ten_aircraft only: {file, steps} row of a progress_scored.csv to headline
#   curve        list of {file, kind: track | progress | ckpts}
#   attempts     ten_aircraft only: attempts_per_seed.csv from attempts_to_solve.py
#   renders      list of {file, meta} (meta = solutions.json) or
#                {file, attribution: filename, checkpoint, seed | reel, mode}
#                or {file, attribution: unknown, claimed}  -> Archive, "attribution unknown"

code_repo: /home/leander/code/tada/monorepo/reinforcement_learning/single_agent_rllib
comparison_seed: 599310825

# Shown on every 10-aircraft card and under the 10-aircraft leaderboard table.
ten_aircraft_note: "Scored on flight_simulator 0.1.52, the simulator these runs trained on. The windowed track uses 0.2.8x, on which the same seeds generate different scenarios, so the two tracks' numbers do not compare."

champion:
  windowed:
    battery: f20
    gate_max_separation_lost: 5        # per 100 seeds; models above it cannot be champion
    order: [solved desc, separation_lost asc, hard_solved desc, clearances asc]
  ten_aircraft:
    battery: d100
    order: [success desc, separation_lost asc]

# Per validation seed: how early its earliest flight arrives at t = 0 under do-nothing, and the
# predicted losses of separation at t = 0 (analysis/validation_seed_capacity.py).
seed_capacity: analysis/2026-09-27_scratch/validation_seed_capacity.csv

# Where the importer finds tests beyond the standard battery (relative to the code repo).
test_sources:
  longstreams: [analysis/2026-09-27_scratch/longstreams/eval]
  phase0: [analysis/2026-09-27_phase0_order_first]
  feasible_2x20: [analysis/2026-09-28_hard/eval, analysis/2026-09-28_hard/eval_test, analysis/2026-09-28_release/eval, analysis/2026-09-28_pms/eval]   # imported only once committed
  backfill_dirs: [analysis/2026-09-28_hard, analysis/2026-09-28_release, analysis/2026-09-28_pms]   # eval/ and renders/; committed files only
  zeroshot_pms: [analysis/2026-09-28_release/zeroshot, analysis/2026-09-28_pms/eval]   # MXP agents scored unchanged on point merge; committed files only
  pms_capacity: analysis/2026-09-28_pms/eval/pms_validation_capacity.csv   # point-merge capacity of the 100 validation seeds

