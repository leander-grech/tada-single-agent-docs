    note: "19 of its 20 losses of separation are on the 49 validation seeds with a flight more than 650 s early (validation_seed_capacity.csv). On the 51 feasible seeds it solves 33 and hard-solves 21 with 1 loss, against 1_38's 34, 15 and 0 (hard-solved 12 gained, 6 lost, p = 0.24). So it is on par with 1_38 on feasible 20-flight streams, and behind on the feasible stitched 40-flight streams it never trained on: on test51 it solves 16 against 25 (3 gained, 12 lost, p = 0.035), hard-solves as many (5 each) and loses 2. Arm D trains on 10- and 20-flight streams only; 1_38 trained on stitched 2×20 streams to the end. Trained with a reward flaw since fixed (code commit 618a073): with pay at release, a flight's bracket paid at release was kept even when the episode then ended in a loss of separation, so a bust cost less than the objective says. Runs after that commit take the release payments of flights still airborne back on a bust. This is a plausible contributor to its losses on over-capacity seeds, not a proven one."

